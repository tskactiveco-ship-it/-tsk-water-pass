<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10231c">
<title>TSK ACTIVE | Membership & Rewards</title>

<style>
:root{
  --green:#087a52;
  --orange:#f49a28;
  --dark:#10231c;
  --bg:#f3f7f4;
  --line:#e2eae5;
  --muted:#63766b;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Tahoma,sans-serif;
  background:var(--bg);
  color:var(--dark);
}
header{
  background:var(--dark);
  color:white;
  text-align:center;
  padding:20px 15px 28px;
  border-bottom:5px solid var(--orange);
}
.company-logo{
  display:block;
  width:170px;
  max-width:55vw;
  height:auto;
  margin:10px auto 15px;
  background:white;
  padding:8px;
  border-radius:16px;
  object-fit:contain;
}
.brand{
  font-size:30px;
  font-weight:900;
  letter-spacing:1px;
}
.brand .tsk{color:#27a977}
.brand .active{color:var(--orange)}
.tagline{
  margin:8px 0;
  color:#d9e7de;
  font-size:13px;
}
.language-box{
  display:flex;
  justify-content:center;
  margin-bottom:15px;
}
.language-box select{
  width:auto;
  min-width:150px;
}
main{
  width:min(100%,720px);
  margin:24px auto;
  padding:0 15px;
}
.card{
  background:white;
  border-radius:20px;
  padding:22px;
  margin-bottom:17px;
  box-shadow:0 8px 28px #0000000b;
}
h2,h3{margin-top:0}
label{
  display:block;
  margin:13px 0 6px;
  font-weight:bold;
  font-size:14px;
}
input,select{
  width:100%;
  min-height:47px;
  padding:12px;
  border:1px solid #cad8cf;
  border-radius:11px;
  background:white;
  color:var(--dark);
  font-size:16px;
}
button{
  border:0;
  border-radius:11px;
  background:var(--green);
  color:white;
  padding:14px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}
button:disabled{
  opacity:.5;
  cursor:not-allowed;
}
.full{width:100%;margin-top:15px}
.orange{background:var(--orange);color:var(--dark)}
.dark{background:var(--dark)}
.light{background:#e8f5ec;color:var(--green)}
.hidden{display:none!important}
.tabs{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px;
  margin-bottom:17px;
}
.tabs button{
  min-height:49px;
  padding:10px 6px;
  font-size:13px;
}
.tabs button.active{
  background:var(--orange);
  color:var(--dark);
}
.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  border-bottom:1px solid var(--line);
  padding:13px 0;
}
.row:last-child{border-bottom:0}
.row strong{
  overflow-wrap:anywhere;
  text-align:end;
}
.info{
  background:#f0f7f2;
  padding:15px;
  border-radius:12px;
  margin:13px 0;
  line-height:1.9;
}
.message{
  background:#e9f7ee;
  color:#075b3b;
  padding:13px;
  border-radius:12px;
  margin-top:14px;
  line-height:1.8;
  overflow-wrap:anywhere;
  white-space:pre-wrap;
}
.message.error{
  background:#fff0ef;
  color:#ae271c;
}
.message.warning{
  background:#fff3df;
  color:#855000;
}
.badge{
  display:inline-block;
  padding:7px 13px;
  border-radius:30px;
  background:#e5f5eb;
  color:var(--green);
  font-weight:bold;
  font-size:13px;
}
.stock-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin:15px 0;
}
.stock-card{
  background:#eff8f2;
  border:1px solid #d7ebde;
  border-radius:13px;
  padding:15px 8px;
  text-align:center;
}
.stock-card strong{
  display:block;
  font-size:25px;
  color:var(--green);
  margin-top:9px;
}
.balance-number{
  color:var(--green);
  font-size:23px;
}
.checkline{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:15px;
}
.checkline input{
  width:22px;
  min-height:22px;
  flex-shrink:0;
}
.checkline label{margin:0}
.order-number{
  font-size:20px;
  font-weight:900;
  color:var(--green);
  direction:ltr;
  text-align:center;
}
.pin-panel{
  border:2px solid #cde8d7;
  background:#f7fcf8;
  border-radius:16px;
  padding:17px;
  margin-top:20px;
}
.pin-panel h3{color:var(--green)}
.pin-help{
  color:var(--muted);
  font-size:13px;
  line-height:1.8;
}
footer{
  text-align:center;
  color:#829187;
  font-size:12px;
  padding:25px;
}
@media(max-width:450px){
  .stock-grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
  <div class="language-box">
    <select id="languageSelect" aria-label="Language">
      <option value="ar">🇸🇦 العربية</option>
      <option value="en">🇬🇧 English</option>
      <option value="bn">🇧🇩 বাংলা</option>
    </select>
  </div>

  <!-- الشعار الأصلي -->
  <img
    src="tsk-logo.jpg"
    alt="TSK ACTIVE"
    class="company-logo"
  >

  <div class="brand">
    <span class="tsk">TSK</span>
    <span class="active">ACTIVE</span>
  </div>

  <div class="tagline">MEMBERSHIP & REWARDS</div>

  <p data-i18n="subtitle">
    العضويات • الباقات • المحفظة • المكافآت
  </p>
</header>

<main>

<!-- LOGIN -->

<section id="loginPage" class="card">
  <h2 data-i18n="login">تسجيل دخول الموظفين</h2>

    <label for="employee" data-i18n="employee">
      رقم الموظف
    </label>
    <input
      id="employee"
      type="text"
      autocomplete="username"
      inputmode="numeric"
      required
    
<form id="loginForm" onsubmit="event.preventDefault(); login(); return false;">
    <label for="password" data-i18n="password">
      كلمة المرور
    </label>
    <input
      id="password"
      type="password"
      autocomplete="current-password"
      required
    >

    <button
      id="loginBtn"
      class="full"
      type="submit"
      data-i18n="loginBtn"
    >
      تسجيل الدخول
    </button>
  </form>

  <div id="loginMessage" aria-live="polite"></div>
</section>

<!-- APP -->

<section id="appPage" class="hidden">

  <!-- STAFF INFORMATION -->

  <div class="card">
    <div class="row">
      <strong data-i18n="dashboard">لوحة الموظف</strong>
      <span id="roleText" class="badge"></span>
    </div>

    <div class="row">
      <span data-i18n="employee">رقم الموظف</span>
      <strong id="employeeText"></strong>
    </div>

    <div class="row">
      <span data-i18n="branch">الفرع</span>
      <strong id="branchText"></strong>
    </div>

    <button
      id="logoutBtn"
      class="full dark"
      type="button"
      data-i18n="logout"
    >
      تسجيل الخروج
    </button>
  </div>

  <!-- NAVIGATION -->

  <div class="tabs">

    <button type="button" data-tab="search" data-i18n="search">
      بحث عن عضو
    </button>

    <button type="button" data-tab="register" data-i18n="register">
      عضو جديد
    </button>

    <button type="button" data-tab="sale" data-i18n="sale">
      بيع باقة
    </button>

    <button type="button" data-tab="redeem" data-i18n="redeem">
      صرف منتج
    </button>

    <button type="button" data-tab="wallet" data-i18n="wallet">
      المحفظة
    </button>

    <button type="button" data-tab="overview" data-i18n="reports">
      التقارير
    </button>

    <button
      type="button"
      data-tab="orders"
      class="orange"
      data-i18n="orders"
    >
      📦 الطلبات الإلكترونية
    </button>

    <button
      type="button"
      id="stockTabButton"
      class="hidden"
      data-tab="stock"
      data-i18n="stock"
    >
      مخزون مياه نوفا
    </button>

  </div>

  <!-- MEMBER SEARCH -->

  <section id="tab-search" class="card">
    <h3 data-i18n="search">بحث عن عضو</h3>

    <input
      id="searchQuery"
      placeholder="TSK-000001 / 05xxxxxxxx"
      autocomplete="off"
    >

    <button
      id="searchBtn"
      class="full"
      type="button"
      data-i18n="searchBtn"
    >
      بحث
    </button>

    <div id="memberResult"></div>

    <!-- MEMBER PIN -->

    <div id="memberPinPanel" class="pin-panel hidden">

      <h3 data-i18n="pinTitle">
        🔐 تفعيل / تغيير رمز دخول المشترك
      </h3>

      <div class="info">
        <span data-i18n="selectedMember">العميل المحدد</span>:
        <strong id="pinMemberName">—</strong>
      </div>

      <p class="pin-help" data-i18n="pinHelp">
        يجب التحقق من هوية صاحب العضوية قبل تعيين
        رمز الدخول أو تغييره.
      </p>

      <label for="memberPin" data-i18n="pinLabel">
        رمز PIN جديد (4 إلى 6 أرقام)
      </label>

      <input
        id="memberPin"
        type="password"
        inputmode="numeric"
        autocomplete
